format = """
$directory$git_branch$git_status$status
$character"""

[character]
success_symbol = '[λ](bold #9ece6a)'
error_symbol = '[λ](bold #f7768e)'

[directory]
truncation_length = 3
truncate_to_repo = true
style = 'bold #7aa2f7'

[git_branch]
style = 'bold #bb9af7'

[git_status]
style = 'bold #e0af68'

[status]
disabled = false
style = '#565f89'
